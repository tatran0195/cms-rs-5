[package]
name = "cms-server-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Shared server foundation and enterprise middleware for CMS"

[dependencies]
# Internal crates
cms-error = { path = "../cms-error" }
cms-config = { path = "../cms-config" }
cms-entity = { path = "../cms-entity" }
cms-biz = { path = "../cms-biz" }
cms-db = { path = "../cms-db" }
cms-storage = { path = "../cms-storage" }
cms-queue = { path = "../cms-queue" }
cms-search = { path = "../cms-search" }
cms-analytics = { path = "../cms-analytics" }
cms-mailer = { path = "../cms-mailer" }
cms-auth = { path = "../cms-auth" }
cms-authz = { path = "../cms-authz" }
cms-authz-gate = { path = "../cms-authz-gate" }
cms-api-keys = { path = "../cms-api-keys" }
cms-i18n = { path = "../cms-i18n" }

# External dependencies
axum = { workspace = true }
axum-extra = { workspace = true, features = ["cookie"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors", "limit", "trace", "request-id", "set-header"] }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true }
ipnet = { workspace = true }
regex = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
url = { workspace = true }
sqlx = { workspace = true }
governor = { workspace = true }
parking_lot = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
