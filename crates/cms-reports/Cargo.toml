[package]
name = "cms-reports"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Report runs and background export vertical slice for CMS"

[dependencies]
cms-db = { path = "../cms-db" }
cms-entity = { path = "../cms-entity" }
cms-error = { path = "../cms-error" }
cms-server-core = { path = "../cms-server-core" }
cms-infra = { path = "../cms-infra" }
cms-auth = { path = "../cms-auth" }
cms-projects = { path = "../cms-projects" }
cms-content = { path = "../cms-content" }
cms-assets = { path = "../cms-assets" }

axum = { workspace = true }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true }
sqlx = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
printpdf = { workspace = true }
epub-builder = { workspace = true }
tempfile = { workspace = true }
pulldown-cmark = { workspace = true }
ammonia = { workspace = true }
rusqlite = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
