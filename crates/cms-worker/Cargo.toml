[package]
name = "cms-worker"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cms-worker"
path = "src/main.rs"
test = false

[dependencies]
tokio = { workspace = true, features = ["full"] }
cms-reports = { path = "../cms-reports" }
cms-db = { path = "../cms-db" }
cms-error = { path = "../cms-error" }
cms-infra = { path = "../cms-infra" }
cms-server-core = { path = "../cms-server-core" }
cms-deployments = { path = "../cms-deployments" }
cms-git = { path = "../cms-git" }
cms-analytics = { workspace = true }
cms-search = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }

# Email delivery
lettre = { workspace = true }
anyhow = { workspace = true }

[features]
default = []

[lints]
workspace = true
