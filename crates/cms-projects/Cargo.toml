[package]
name = "cms-projects"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Project workspace vertical slice (projects, members, settings, domains, reader access, addons)"

[dependencies]
cms-db = { path = "../cms-db" }
cms-entity = { path = "../cms-entity" }
cms-error = { path = "../cms-error" }
cms-server-core = { path = "../cms-server-core" }
cms-auth = { path = "../cms-auth" }
cms-authz = { path = "../cms-authz" }

axum = { workspace = true }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true }
sqlx = { workspace = true }
anyhow = { workspace = true }
validator = { workspace = true }
utoipa = { workspace = true }
idna = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
